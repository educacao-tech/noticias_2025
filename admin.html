<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel Administrativo - Notícias</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body class="admin-body">
    <div class="admin-container">
        <!-- Seção de Login -->
        <div id="login-section">
            <h2>Login Administrativo</h2>
            <div class="form-group">
                <label for="username">Usuário</label>
                <input type="text" id="username" placeholder="admin" required>
            </div>
            <div class="form-group">
                <label for="password">Senha</label>
                <div class="password-input-wrapper">
                    <input type="password" id="password" placeholder="123" required>
                    <span class="toggle-password-visibility" data-target="password" title="Mostrar/Esconder senha">👁️</span>
                </div>
            </div>
            <button class="btn-save" onclick="Admin.login()">Entrar</button> <br><br>
            <small>Usuário: admin, Senha: 123 (para testes)</small>
        </div>

        <!-- Seção de Gerenciamento (Escondida inicialmente) -->
        <div id="admin-content" class="hidden">
            <header class="admin-header">
                <h2>Gerenciar Notícias</h2>
                <div>
                    <button onclick="Admin.togglePasswordSection(true)">Alterar Senha</button>
                    <button onclick="Admin.logout()">Sair</button>
                </div>
            </header>
            
            <!-- Seção de Alterar Senha (Escondida por padrão) -->
            <div id="password-section" class="hidden">
                <h3>Alterar Minha Senha</h3>
                <form id="password-form" onsubmit="Admin.changePassword(event)">
                    <div class="form-group">
                        <label for="current-password">Senha Atual</label>
                        <div class="password-input-wrapper">
                            <input type="password" id="current-password" required>
                            <span class="toggle-password-visibility" data-target="current-password" title="Mostrar/Esconder senha">👁️</span>
                        </div>
                    </div>
                    <div class="form-group">
                        <label for="new-password">Nova Senha</label>
                        <div class="password-input-wrapper">
                            <input type="password" id="new-password" required minlength="6">
                            <span class="toggle-password-visibility" data-target="new-password" title="Mostrar/Esconder senha">👁️</span>
                        </div>
                        <div class="strength-meter">
                            <div id="strength-bar"></div>
                        </div>
                        <small id="strength-text"></small>
                    </div>
                    <div class="form-group">
                        <label for="confirm-password">Confirmar Nova Senha</label>
                        <div class="password-input-wrapper">
                            <input type="password" id="confirm-password" required minlength="6">
                            <span class="toggle-password-visibility" data-target="confirm-password" title="Mostrar/Esconder senha">👁️</span>
                        </div>
                    </div>
                    <button type="submit" class="btn-save">Salvar Nova Senha</button>
                    <button type="button" onclick="Admin.togglePasswordSection(false)" class="btn-cancel">Cancelar</button>
                </form>
            </div>

            <!-- Modal de Cadastro/Edição de Notícias -->
            <div id="news-modal" class="modal-overlay">
                <div class="modal-content large">
                    <h3 id="modal-title">Adicionar Notícia</h3>
                    <form id="news-form" onsubmit="Admin.handleSubmit(event)">
                        <input type="hidden" id="edit-mode" value="false">
                        <input type="hidden" id="news-id" value="">
                        <div class="form-group">
                            <label for="title">Título</label>
                            <input type="text" id="title" required>
                        </div>
                        <div class="form-group">
                            <label for="link">Link da Notícia (Identificador Único)</label>
                            <input type="url" id="link" required>
                        </div>
                        <div class="form-group">
                            <label for="imageUrl">URL da Imagem</label>
                            <input type="url" id="imageUrl" required>
                            <img id="image-preview" src="" alt="Prévia da Imagem">
                        </div>
                        <div class="form-group">
                            <label for="date">Data (AAAA-MM-DD)</label>
                            <input type="date" id="date" required>
                        </div>
                        <div class="form-group">
                            <label for="displayDate">Data Exibição (Ex: 09 de Junho de 2026)</label>
                            <input type="text" id="displayDate" required>
                        </div>
                        <div class="form-group">
                            <label for="description">Descrição</label>
                            <textarea id="description" rows="4" required></textarea>
                        </div>
                        <div class="form-group">
                            <label for="readMoreText">Texto do Botão (Ex: Leia Mais)</label>
                            <input type="text" id="readMoreText" value="Leia Mais">
                        </div>
                        <div class="form-group">
                            <label for="instagramLink">Link Instagram (Opcional)</label>
                            <input type="url" id="instagramLink">
                        </div>
                        <div class="form-group">
                            <label for="altText">Texto Alternativo (Acessibilidade)</label>
                            <input type="text" id="altText">
                        </div>
                        <div class="modal-buttons">
                            <button type="button" class="btn-cancel" onclick="Admin.closeNewsModal()">Cancelar</button>
                            <button type="submit" class="btn-save" id="btn-submit">Salvar Notícia</button>
                        </div>
                    </form>
                </div>
            </div>

            <div class="admin-list">
                <header class="admin-list-header">
                    <h3>Notícias Atuais</h3>
                    <div>
                        <button class="btn-save" onclick="Admin.openNewsModal()">Nova Notícia</button>
                        <button class="btn-save btn-secondary" onclick="Admin.triggerCSVImport()">Importar CSV</button>
                        <button class="btn-save btn-secondary" onclick="Admin.exportNewsToCSV()">Exportar CSV</button>
                    </div>
                </header>
                <input type="file" id="csv-import-input" accept=".csv" class="hidden">
                <div class="form-group">
                    <input type="search" id="admin-search-input" placeholder="Filtrar por título ou descrição...">
                </div>
                <div id="admin-news-items"> 
                    <!-- Lista preenchida via JS -->
                </div>
                <div id="pagination-controls" class="pagination-container"></div>
            </div>
        </div>
    </div>

    <!-- Contêiner para as notificações Toast -->
    <div id="toast-container" class="toast-container"></div>

    <!-- Modal de Confirmação de Exclusão -->
    <div id="delete-confirmation-modal" class="modal-overlay">
        <div class="modal-content">
            <h3>Confirmar Exclusão</h3>
            <p>Tem certeza que deseja excluir a notícia: <br><strong id="news-title-to-delete"></strong>?</p>
            <div class="modal-buttons">
                <button id="cancel-delete-btn" class="btn-cancel">Cancelar</button>
                <button id="confirm-delete-btn" class="btn-confirm">Excluir</button>
            </div>
        </div>
    </div>

    <!-- Overlay de Carregamento (Spinner) -->
    <div id="loading-overlay" class="loading-overlay">
        <div class="spinner"></div>
    </div>

    <script src="admin.js"></script>
</body>
</html>

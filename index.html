<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portal de Notícias - Secretaria Municipal de Educação</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main>
        <section class="latest-news" aria-labelledby="latest-news-title" role="region">
            
            <!-- Barra Superior com Controles de Tema e Acesso -->
            <div class="theme-switcher-container">
                <button id="theme-toggle" class="theme-toggle-button" aria-label="Alternar tema" title="Alternar Modo Escuro/Claro">
                    <svg id="theme-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" width="24" height="24">
                        <!-- Ícone inserido via JS -->
                    </svg>
                </button>
                <button id="login-button" class="theme-toggle-button" aria-label="Acessar painel administrativo" title="Acessar Painel Administrativo">
                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" width="24" height="24">
                        <path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/>
                    </svg>
                </button>
                <span id="theme-status" class="visually-hidden" aria-live="polite"></span>
            </div>

            <h1 id="latest-news-title">Últimas Notícias e Acontecimentos</h1>

            <!-- Barra de Busca -->
            <div class="search-container">
                <label for="search-input" class="visually-hidden">Filtrar notícias por título ou descrição</label>
                <input type="search" id="search-input" placeholder="Buscar notícias por título, assunto ou palavra-chave..." autocomplete="off">
            </div>

            <!-- Filtros de Categorias e Ano -->
            <div class="filter-pills-container">
                <div class="category-pills" id="category-pills">
                    <!-- Gerado dinamicamente via JS (Todas, Mais Lidas, etc.) -->
                </div>
                <div class="year-selector-wrapper">
                    <select id="year-filter-select" class="year-select" aria-label="Filtrar por ano">
                        <option value="all">📅 Todos os Anos</option>
                        <option value="2026" selected>Ano 2026</option>
                        <option value="2025">Ano 2025</option>
                    </select>
                </div>
            </div>

            <!-- Notícia em Destaque Principal (Hero Card) -->
            <div id="hero-featured-news" class="hero-container hidden">
                <!-- Inserido dinamicamente via JS -->
            </div>

            <!-- Grade com 4 Colunas de Notícias -->
            <div class="news-preview-container">
                <div class="spinner"></div> <!-- Indicador de carregamento -->
                <p class="no-results-message hidden">Nenhuma notícia encontrada com os filtros selecionados.</p>
                <!-- As notícias serão inseridas aqui pelo JavaScript -->
            </div>

            <!-- Controles de Paginação -->
            <div id="pagination-controls" class="pagination-container"></div>
        </section>
    </main>

    <!-- Botão Voltar ao Topo -->
    <button id="back-to-top" class="back-to-top-button" title="Voltar ao topo">
        <span class="visually-hidden">Voltar ao topo</span>
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" width="24" height="24">
            <path d="M7.41 15.41L12 10.83l4.59 4.58L18 14l-6-6-6 6 1.41 1.41z" />
        </svg>
    </button>

    <!-- Toast de Notificações (ex: Link copiado) -->
    <div id="toast-container" class="toast-container"></div>

    <!-- ================= Modal Lightbox de Imagens (Alta Resolução) ================= -->
    <div id="lightbox-modal" class="lightbox-overlay" role="dialog" aria-modal="true" aria-label="Visualizador de imagem em alta resolução">
        <div class="lightbox-toolbar">
            <span id="lightbox-counter" class="lightbox-counter">1 de 1</span>
            <div class="lightbox-actions">
                <a id="lightbox-download-btn" href="#" download class="lightbox-btn" title="Baixar imagem em alta resolução" target="_blank">
                    💾 Baixar Imagem
                </a>
                <button type="button" id="lightbox-close-btn" class="lightbox-btn close" onclick="App.lightbox.close()" title="Fechar (ESC)">
                    ✕
                </button>
            </div>
        </div>

        <div class="lightbox-content-wrapper">
            <button type="button" id="lightbox-prev-btn" class="lightbox-nav-btn prev" onclick="App.lightbox.prev()" title="Foto anterior">
                &#10094;
            </button>

            <div class="lightbox-image-box">
                <img id="lightbox-main-img" src="" alt="Imagem ampliada" onclick="App.lightbox.toggleZoom()" title="Clique para dar Zoom">
                <div id="lightbox-caption" class="lightbox-caption"></div>
            </div>

            <button type="button" id="lightbox-next-btn" class="lightbox-nav-btn next" onclick="App.lightbox.next()" title="Próxima foto">
                &#10095;
            </button>
        </div>
    </div>

    <!-- Script principal com busca, paginação, áudio, lightbox e métricas -->
    <script src="script.js"></script>

    <!-- Início do Plugin V-Libras -->
    <div vw class="enabled">
        <div vw-access-button class="active"></div>
        <div vw-plugin-wrapper>
            <div class="vw-plugin-top-wrapper"></div>
        </div>
    </div>
    <script src="https://vlibras.gov.br/app/vlibras-plugin.js"></script>
    <script>
        new window.VLibras.Widget('https://vlibras.gov.br/app');
    </script>
    <!-- Fim do Plugin V-Libras -->
</body>

</html>
